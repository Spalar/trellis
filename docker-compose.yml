version: "3.8"

services:
  trellis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trellis-server
    ports:
      - "17317:17317"
    environment:
      - TRELLIS_TRANSPORT=${TRELLIS_TRANSPORT:-http}
      - TRELLIS_HOST=0.0.0.0
      - TRELLIS_PORT=17317
      - TRELLIS_API_KEY=${TRELLIS_API_KEY:-dev-key-change-me}
      - TRELLIS_ALLOW_NO_AUTH=${TRELLIS_ALLOW_NO_AUTH:-false}
      - TRELLIS_DATA_DIR=/data
    volumes:
      - trellis-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:17317/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  trellis-data:
