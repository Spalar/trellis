[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trellis-core"
version = "0.1.0"
description = "Trellis Core MCP graph and impact analysis server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=3.2.4",
  "pydantic>=2.7.0",
  "starlette>=0.40.0",
  "tree-sitter>=0.25.2",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-typescript>=0.23.0",
  "python-dotenv>=1.0.0",
  "GitPython>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
markers = [
  "server_test: marks tests that require a running HTTP server",
]

[tool.setuptools]
py-modules = [
  "auth",
  "engine",
  "extractor",
  "feature_intent",
  "impact_analyzer",
  "models",
  "router",
  "server",
  "spec_manager",
  "store",
  "visualizer",
]
