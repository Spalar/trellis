[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trellis-client"
version = "0.1.0"
description = "Python client SDK for the Trellis REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Documentation = "http://127.0.0.1:17317/docs"

[tool.setuptools]
packages = ["trellis_client"]
